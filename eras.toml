# Kernel eras: the era GCC e(K), the host environment each kernel is built in, and the rucc-kernel plan eras each one maps to (spec 03.3 and 05.2).
#
# An era runs from its `from` up to the next era's `from`. Hosts change inside an era where a Debian release boundary falls there. A boundary moves only with evidence, an era diagonal cell that fails where the neighbouring era's GCC or host works, and `notes` records the reason and the cell.

[[era]]
name = "X0"
from = "0.01"
gcc = "gcc-1.40"
hosts = [{ from = "0.01", value = "gk-host-minix" }, { from = "0.10", value = "gk-host-linux012" }]
notes = "The era GCC is the gcc 1.40 Linus built 0.11 and 0.12 with, the binaries of 22 September 1991 in oldlinux's gccbin.tar.Z, whose cc1 takes -mstring-insns. With them pristine 0.11 and 0.12 build and boot, but only under Bochs, since QEMU's floppy and IDE models stop their drivers, and only by hand so far, so no tree of this era is a row yet. 0.01 needs the Minix assembler and Minix's ls, so it waits for gk-host-minix. reports/museum-0x.md has the runs."

[[era]]
name = "X1"
from = "0.95"
gcc = "gcc-2.5.8"
hosts = [{ from = "0.95", value = "gk-host-hamm" }]
notes = "Built in hamm for the reason M0 is: bo's libc5 tools fail on a recent host kernel before they do any work. 2.5.8 is the newest GCC of the era and the only one the forge has. No tree of the era builds with it: 0.95 and 0.96c have no configuration target, 0.99.11 and 0.99.12 compile as C++ and the bundle has C only, 0.99.13 declares panic twice in a way 2.5.8 refuses, and 0.99.15 links with the -T of GNU ld 1.x, which binutils 2.8.1 reads as a script. reports/museum-0x.md has the cells."

[[era]]
name = "M0"
from = "1.0"
plan-eras = ["E0"]
gcc = "gcc-2.5.8"
hosts = [{ from = "1.0", value = "gk-host-hamm" }]
notes = "Built in hamm rather than bo. Every libc5 program calls personality(PER_LINUX) as it starts, which drops ADDR_NO_RANDOMIZE before its children run, and then sets the break to the end of its own data with brk. A kernel that places the heap at a random distance from there, as any recent one does, answers with the break where it put it, and libc5 takes that for out of memory, so bo's gcc, make and dpkg all fail before they do any work. Hamm is the first release on glibc, whose brk asks the kernel where the heap is. 1.0 builds all the way to its last step and stops there: binutils 2.8.1, which the bundle of 2.5.8 is built with, links a.out for Linux only as QMAGIC, and the tools/build of 1.0 takes only the ZMAGIC of the linkers of its day. 1.2 asks for QMAGIC itself and builds."

