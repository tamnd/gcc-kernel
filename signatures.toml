  { commit = "cb984d101b30", first-tag = "v4.2-rc1", stable = ["3.10"], bisected = true },
  { commit = "71458cfc782e", first-tag = "v3.18-rc1", stable = ["3.10", "3.13"], note = "adds compiler-gcc5.h only", bisected = true },
]
