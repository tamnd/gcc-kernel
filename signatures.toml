# The failure catalog of spec 08. Every failed cell is run through these by `gk classify`.
#
# A signature applies to a cell that failed at one of its rungs when every pattern of `match` finds something in the matching part of the cell: `first-error` (the refusal, the first error of the first failing unit, or the first bad console line), `unit`, `console`, `config` or `command`. The patterns are Rust regular expressions. The ranges `gcc`, `binutils` and `kernel` are versions joined by `,` for all and `|` for any, and `platform` is a list. A cell that matches the patterns but falls outside the ranges is reported as a new finding instead of being classified, unless another signature classifies it.
#
# The seed is spec 08.4. Where a fix is a policy the kernel kept, `fixed-by` names the commit with no tag. The runtime signatures (L5 to L7) are wide on purpose until real cells narrow them.
#
# objtool warnings fail L4 where CONFIG_OBJTOOL_WERROR makes them fatal and L8 otherwise, so the objtool signatures cover both.

# Refusals and blacklists, oldest first.

[[signature]]
class = "gcc-too-old-295"
rung = "L1..L3"
match = { first-error = 'Sorry, your GCC is too old\. It builds incorrect kernels' }
kind = "refusal"
summary = "2.6.0 to 2.6.15 refuse anything below GCC 2.95 in init/main.c, which the probe does not compile, so the refusal can wait for L3"
gcc = "<2.95"
kernel = "<2.6.16"

[[signature]]
class = "gcc-min-32"
rung = "L1..L3"
match = { first-error = 'your compiler is too old/not recognized|your GCC is too old\. It builds incorrect kernels' }
kind = "refusal"
summary = "2.6.16 to 2.6.28 refuse anything below GCC 3.2, in compiler.h for GCC 2 and egcs and in init/main.c or compiler.h for 3.0 and 3.1"
fixed-by = [ { commit = "fd285bb54d8a", first-tag = "v2.6.16-rc1", note = "drops compiler-gcc2.h, so compiler.h refuses GCC 2; the refusal is the policy. a1365647022e, which removes the other gcc-2 checks, comes after it", bisected = true } ]
gcc = "<3.2"
kernel = ">=2.6.16, <2.6.29"

[[signature]]
class = "gcc-296-frame-pointer"
rung = "L1"
match = { first-error = 'frame pointer', config = '(?m)^CONFIG_FRAME_POINTER=y' }
kind = "refusal"
summary = "2.6.0 to 2.6.15 refuse GCC 2.96 when frame pointers are on"
fixed-by = [ { commit = "fd285bb54d8a", first-tag = "v2.6.16-rc1", note = "removes the frame pointer check from init/main.c, and from then on compiler.h refuses every GCC 2. Read from the diff, since there is no GCC 2.96 column to bisect with" } ]
gcc = "=2.96"

[[signature]]
class = "gcc3-0-1-refused"
rung = "L1..L3"
match = { first-error = 'too old|please upgrade' }
kind = "refusal"
summary = "From 2.6.29 the kernel refuses GCC 3.0 and 3.1 in compiler-gcc3.h, which the probe does not always reach, so the refusal can wait for L3"
fixed-by = [ { commit = "6680598", note = "the refusal is the policy. 2.6.28 already refuses GCC 3.0 and 3.1, in compiler.h with the message gcc-min-32 matches. In 2.6.29 f153b82121b0 drops that check from compiler.h and this commit adds the same one to compiler-gcc3.h, so a bisection from 2.6.28 to 2.6.29 finds both ends refusing and has nothing to bisect" } ]
gcc = "=3.0 | =3.1"
kernel = ">=2.6.29"

[[signature]]
class = "arm-gcc3-below-33"
rung = "L1"
match = { first-error = 'Known good compilers|too buggy|miscompile' }
kind = "refusal"
summary = "arm refuses GCC 3 below 3.3 in asm-offsets.c"
fixed-by = [ { commit = "a136564", note = "the refusal is the policy" } ]
gcc = ">=3.0, <3.3"
platform = ["arm"]

[[signature]]
class = "gcc41-weak"
rung = "L1"
match = { first-error = 'miscompiles the __weak directive' }
kind = "blacklist"
summary = "GCC 4.1.0 and 4.1.1 miscompile __weak (GCC PR 27781) and the kernel refuses them"
fixed-by = [ { commit = "f9d1425", note = "the blacklist is the policy" } ]
gcc = "4.1.0 | 4.1.1"
kernel = ">=2.6.29"

[[signature]]
class = "no-compiler-header"
rung = "L1"
match = { first-error = 'linux/compiler-gcc(\d+)\.h: No such file or directory' }
