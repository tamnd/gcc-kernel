gcc = "<4.9"
kernel = ">=5.8, <5.15"

[[signature]]
class = "gcc-min-51"
rung = "L1"
match = { first-error = 'not supported|too old|Minimum GCC version:\s+5\.1' }
kind = "refusal"
summary = "5.15 to 6.15 need GCC 5.1"
fixed-by = [ { commit = "76ae847497bc", note = "the minimum is the policy" } ]
gcc = "<5.1"
