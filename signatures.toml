kind = "refusal"
summary = "From 2.6.29 the kernel refuses GCC 3.0 and 3.1"
fixed-by = [ { commit = "6680598", note = "the refusal is the policy" } ]
gcc = "=3.0 | =3.1"
kernel = ">=2.6.29"

[[signature]]
