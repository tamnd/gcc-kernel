gcc = ">=9"
flavor = ["ubuntu"]

[[signature]]
class = "fno-common"
rung = "L3"
match = { first-error = 'multiple definition of `' }
kind = "default-change"
summary = "GCC 10 defaults to -fno-common, and host programs such as dtc with tentative definitions stop linking"
