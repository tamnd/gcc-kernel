# Miscompiles, found only by booting.

[[signature]]
class = "asm-goto-miscompile"
rung = "L5..L7"
match = { first-error = 'Kernel panic|BUG:|Oops|general protection fault|Unable to handle kernel' }
kind = "miscompile"
summary = "GCC up to 4.8.1 miscompiles asm goto (GCC PR 58670) and the kernel crashes where it uses jump labels"
fixed-by = [
  { commit = "3f0116c", first-tag = "v3.12-rc5" },
  { commit = "a9f180345f53", first-tag = "v3.14-rc3", note = "makes the workaround unconditional" },
]
gcc = ">=4.5, <=4.8.1"
kernel = "<3.12"

[[signature]]
class = "gcc49-load-balance"
rung = "L5..L7"
match = { first-error = 'Kernel panic|BUG:|Oops|general protection fault|Unable to handle kernel|detected stalls|soft lockup' }
kind = "miscompile"
summary = "GCC 4.9.0 and 4.9.1 spill a register wrong in the scheduler's load_balance() (GCC PR 61801)"
fixed-by = [ { commit = "2062afb4f804", first-tag = "v3.16-rc7", stable = ["3.13"] } ]
gcc = "4.9.0 | 4.9.1"
kernel = "<3.16"

[[signature]]
class = "gcc10-start-secondary"
rung = "L5"
match = { first-error = 'stack-protector: Kernel stack is corrupted in: start_secondary' }
kind = "miscompile-by-assumption"
summary = "GCC 10 tail-calls cpu_startup_entry() after the stack canary is set up"
fixed-by = [ { commit = "a9a3ed1eff36", first-tag = "v5.7", stable = ["4.4", "4.9", "4.14", "4.19", "5.4"] } ]
gcc = ">=10"
platform = ["x86_64", "i386"]

[[signature]]
class = "gcc15-counted-by-kunit"
rung = "L7"
match = { first-error = 'KUnit run \d+: .*\boverflow\b', console = 'DEFINE_FLEX_test: EXPECTATION FAILED' }
kind = "miscompile-by-assumption"
summary = "GCC 15 is the first GCC with __counted_by, and with it __builtin_dynamic_object_size of a DEFINE_FLEX struct takes the counter in, so the overflow KUnit suite's DEFINE_FLEX_test sees 12 where it expects 8"
fixed-by = [ { commit = "04e403e6627d", first-tag = "v6.15-rc1", note = "tests the struct and the flexible array sizes apart, not on 6.12.y" } ]
gcc = ">=15"
kernel = "<6.15"

[[signature]]
class = "gcc15-union-padding"
rung = "L5..L7"
match = { first-error = 'Kernel panic|BUG:|Oops|general protection fault|Unable to handle kernel|KASAN:|UBSAN:' }
kind = "miscompile-by-assumption"
summary = "From GCC 15, {0} no longer zeroes a whole union, and a kernel that relied on it may misbehave"
fixed-by = [ { commit = "dce4aab8441d", first-tag = "v6.14", note = "-fzero-init-padding-bits=all, on 6.12.y and later but not 6.6 or 6.1" } ]
gcc = ">=15"
kernel = "<6.14"

