# The rig, not the compiler.

[[signature]]
class = "over-budget"
rung = "L3..L7"
match = { first-error = 'went over its budget|^timed out after' }
kind = "timeout"
summary = "The step ran out of its time budget with no other sign of failure, which on a loaded machine says more about the machine than the cell"

[[signature]]
class = "disk-full"
rung = "L1..L5"
match = { first-error = 'No space left on device' }
kind = "host-tool"
summary = "The build machine ran out of disk, so the cell says nothing about the kernel or the compiler, and a search runs it again"

[[signature]]
class = "tree-gone"
rung = "L1..L2"
match = { first-error = "No rule to make target '[a-z]*config'" }
kind = "host-tool"
summary = "make found no configuration target in /src because the unpacked tree was taken out of the cache while the cell was starting on it, so the cell says nothing about the kernel or the compiler, and a search runs it again"

[[signature]]
class = "woody-depmod-kstrtab"
rung = "L4"
match = { first-error = 'depmod: \s+\S+_R(smp_)?[0-9a-f]{8}' }
kind = "host-tool"
summary = "Woody's depmod, from modutils 2.4.15, reads only the __kstrtab_ symbols that nm types ?, and the nm of later binutils, such as the 2.16.1 that comes with GCC 3.4.6, types them R, so every symbol a 2.4 module takes from the kernel is unresolved. The woody host now builds depmod from modutils 2.4.27"
kernel = ">=2.4, <2.5"
platform = ["i386"]

[[signature]]
class = "tcg-tsc-clock"
rung = "L6"
match = { first-error = 'smoke checks failed: clock$', console = 'Using tsc for high-res timesource' }
kind = "emulator"
summary = "Before 2.6.18, i386 interpolates the time of day from the TSC with the cpu_khz it measured at boot. Under TCG on a loaded host that measurement can be off by a factor of four or come out negative, so a 20 ms nap reads as less than 19 ms and the clock check fails in one boot of three. The cell says nothing about GCC"
kernel = ">=2.6, <2.6.18"
platform = ["i386"]

[[signature]]
class = "tcg-hpet-clock"
rung = "L6"
match = { first-error = 'smoke checks failed: clock$', console = 'time\.c: Using HPET(/TSC)? based timekeeping' }
kind = "emulator"
summary = "Before 2.6.21, x86_64 reads the time of day as the time of the last tick plus how far the HPET counter, or the TSC from 2.6.12, has run since then, scaled by a factor set at boot, and nanosleep counts ticks. Under TCG on a loaded host the two drift apart, so a 20 ms nap can read as less than 19 ms. It fails the clock check in one or two boots of three on 2.6.1, 2.6.6 and 2.6.12 with GCC 3.2.3 and 4.2.4, and the other boots of the same cells pass it, so the cell says nothing about GCC"
kernel = ">=2.6, <2.6.21"
platform = ["x86_64"]

[[signature]]
class = "tcg-ioapic-timer"
rung = "L5"
match = { first-error = "IO-APIC \\+ timer doesn't work" }
kind = "emulator"
summary = "check_timer() gives the PIT a few jiffies to tick through the IO-APIC, and under TCG on a loaded host the vCPU can miss that window. It shows in one boot of three, on kernels from 2.6.26 to 6.1 with GCCs from 3.4 to 12 that boot cleanly in the other two, so the cell says nothing about GCC"
platform = ["x86_64", "i386"]

[[signature]]
class = "tcg-rtc-kunit-stall"
rung = "L8"
match = { first-error = 'rcu: INFO: rcu_sched (self-detected stall on CPU|detected stalls on CPUs/tasks)' }
kind = "emulator"
summary = "5.10 runs every KUnit suite in the smoke boot, and rtc_time64_to_tm_test_date_range walks 160,000 years without a break, which under TCG takes longer than the 21 second RCU stall timeout. Every GCC that boots 5.10.270 on x86_64 stalls in the same test, so the cell says nothing about GCC"
fixed-by = [ { commit = "95c46336ab47", first-tag = "v6.10-rc1", note = "splits the test and marks the 160,000 year range slow, not on 5.10.y" } ]
kernel = ">=5.10, <5.11"
platform = ["x86_64"]

[[signature]]
class = "stable61-longest-symbol"
rung = "L7..L8"
match = { first-error = 'BUG: kernel NULL pointer dereference', console = 'test_longest_symbol_kallsyms: test_longest_symbol kallsyms: kprobe registered' }
kind = "kernel-bug"
summary = "6.1.188 took the longest-symbol KUnit test from 6.15. On 6.1 the kallsyms lookup of the 511 character symbol comes back empty, and test_longest_symbol_kallsyms calls it anyway, so every GCC from 8.5.0 to 16.2.0 jumps to address 0 in every KUnit boot. 6.6, 6.12 and 6.18 carry the same test and pass it"
kernel = ">=6.1.188, <6.2"
platform = ["x86_64", "i386"]

[[signature]]
class = "out-of-tree-include"
rung = "L3"
match = { first-error = 'arch/x86_64/pci/[a-z0-9]+\.c:\d+(:\d+)?: pci\.h: No such file or directory' }
kind = "out-of-tree"
summary = "arch/x86_64/pci/Makefile adds `-I arch/i386/pci` with a space, so kbuild never sees a `-I` word to point at the source tree, and with gk's O= build mmconfig.c cannot find pci.h. 2.6.9 drops the space before git. A tree built in place compiles, so the cell says nothing about GCC"
kernel = ">=2.6.5, <2.6.9"
platform = ["x86_64"]

# Changed defaults.

[[signature]]
class = "distro-ssp"
rung = "L3"
match = { first-error = "undefined reference to `__stack_chk_fail'" }
kind = "default-change"
summary = "Ubuntu's GCC builds with -fstack-protector by default from 6.10, and a kernel from before kbuild turned it off calls __stack_chk_fail, which the kernel does not have"
fixed-by = [
  { commit = "34c162f79e37", first-tag = "v2.6.18-rc1", note = "passes -fno-stack-protector-all -fno-stack-protector, which Ubuntu's GCC rejects as a pair, so cc-option drops both" },
  { commit = "eb2cafa1d902", first-tag = "v2.6.18-rc4", note = "passes -fno-stack-protector alone, the fix for Ubuntu", bisected = true },
]
