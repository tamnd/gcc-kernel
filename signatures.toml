gcc = ">=10"
platform = ["x86_64", "i386"]

[[signature]]
class = "gcc15-union-padding"
rung = "L5..L7"
match = { first-error = 'Kernel panic|BUG:|Oops|general protection fault|Unable to handle kernel|KASAN:|UBSAN:' }
kind = "miscompile-by-assumption"
summary = "From GCC 15, {0} no longer zeroes a whole union, and a kernel that relied on it may misbehave"
fixed-by = [ { commit = "dce4aab8441d", first-tag = "v6.14", note = "-fzero-init-padding-bits=all, on 6.12.y and later but not 6.6 or 6.1" } ]
gcc = ">=15"
kernel = "<6.14"

