  { commit = "f153b82121b0", first-tag = "v2.6.29-rc1", note = "changes the refusal into a missing header", bisected = true },
  { commit = "cb984d101b30", first-tag = "v4.2-rc1", stable = ["3.10"] },
]
gcc = ">=5"
kernel = ">=2.6.12, <2.6.29"

[[signature]]
