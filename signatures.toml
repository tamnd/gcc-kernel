  { commit = "947d5d036c78", first-tag = "v6.13", note = "loongarch" },
  { commit = "5a821e2d69e2", first-tag = "v6.16", stable = ["6.6", "6.12"], note = "powerpc boot" },
  { commit = "7cbb015e2d3d", first-tag = "v6.16", note = "parisc" },
