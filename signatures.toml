match = { first-error = 'compiler is too old|please use 4\.6' }
kind = "refusal"
summary = "4.19 to 5.7 need GCC 4.6"
fixed-by = [ { commit = "cafa0010cd51", note = "the minimum is the policy" } ]
gcc = "<4.6"
kernel = ">=4.19, <5.8"

[[signature]]
