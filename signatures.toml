# The failure catalog of spec 08. Every failed cell is run through these by `gk classify`.
#
# A signature applies to a cell that failed at one of its rungs when every pattern of `match` finds something in the matching part of the cell: `first-error` (the refusal, the first error of the first failing unit, or the first bad console line), `unit`, `console`, `config` or `command`. The patterns are Rust regular expressions. The ranges `gcc`, `binutils` and `kernel` are versions joined by `,` for all and `|` for any, and `platform` is a list. A cell that matches the patterns but falls outside the ranges is reported as a new finding instead of being classified.
#
# The seed is spec 08.4. Where a fix is a policy the kernel kept, `fixed-by` names the commit with no tag. The runtime signatures (L5 to L7) are wide on purpose until real cells narrow them.
#
# objtool warnings fail L4 where CONFIG_OBJTOOL_WERROR makes them fatal and L8 otherwise, so the objtool signatures cover both.

# Refusals and blacklists, oldest first.

[[signature]]
class = "gcc-too-old-295"
rung = "L1"
match = { first-error = 'Sorry, your GCC is too old\. It builds incorrect kernels' }
kind = "refusal"
summary = "2.6.0 to 2.6.15 refuse anything below GCC 2.95 in init/main.c"
gcc = "<2.95"
kernel = "<2.6.16"

[[signature]]
class = "gcc-296-frame-pointer"
rung = "L1"
match = { first-error = 'frame pointer', config = '(?m)^CONFIG_FRAME_POINTER=y' }
kind = "refusal"
summary = "2.6.0 to 2.6.15 refuse GCC 2.96 when frame pointers are on"
fixed-by = [ { commit = "a136564", first-tag = "v2.6.16-rc1", note = "removes the gcc-2 checks" } ]
gcc = "=2.96"

[[signature]]
class = "gcc3-0-1-refused"
rung = "L1"
match = { first-error = 'too old|please upgrade' }
kind = "refusal"
summary = "From 2.6.29 the kernel refuses GCC 3.0 and 3.1"
fixed-by = [ { commit = "6680598", note = "the refusal is the policy" } ]
gcc = "=3.0 | =3.1"
kernel = ">=2.6.29"

[[signature]]
class = "arm-gcc3-below-33"
rung = "L1"
match = { first-error = 'Known good compilers|too buggy|miscompile' }
kind = "refusal"
summary = "arm refuses GCC 3 below 3.3 in asm-offsets.c"
fixed-by = [ { commit = "a136564", note = "the refusal is the policy" } ]
gcc = ">=3.0, <3.3"
platform = ["arm"]

[[signature]]
class = "gcc41-weak"
rung = "L1"
match = { first-error = 'miscompiles the __weak directive' }
kind = "blacklist"
summary = "GCC 4.1.0 and 4.1.1 miscompile __weak (GCC PR 27781) and the kernel refuses them"
fixed-by = [ { commit = "f9d1425", note = "the blacklist is the policy" } ]
gcc = "4.1.0 | 4.1.1"
kernel = ">=2.6.29"

[[signature]]
class = "no-compiler-header"
rung = "L1"
match = { first-error = 'linux/compiler-gcc(\d+)\.h: No such file or directory' }
kind = "refusal"
summary = "Kernels 2.6.29 to 4.1 include one header per GCC major version and have none for this one"
fixed-by = [
  { commit = "cb984d101b30", first-tag = "v4.2-rc1", stable = ["3.10"] },
  { commit = "71458cfc782e", first-tag = "v3.18-rc1", stable = ["3.10", "3.13"], note = "adds compiler-gcc5.h only" },
]
gcc = ">=5"
kernel = ">=2.6.29, <=4.1"

[[signature]]
class = "compiler-h-gnuc-gt-4"
rung = "L1"
match = { first-error = 'no compiler-gcc\.h file for this gcc version' }
kind = "refusal"
summary = "2.6.12 to 2.6.28 stop on any GCC major above 4 in compiler.h"
fixed-by = [
  { commit = "f153b82", first-tag = "v2.6.29-rc1", note = "changes the refusal into a missing header" },
  { commit = "cb984d101b30", first-tag = "v4.2-rc1", stable = ["3.10"] },
]
gcc = ">=5"
kernel = ">=2.6.12, <2.6.29"

[[signature]]
class = "arm-gcc48-pr58854"
rung = "L1"
match = { first-error = 'too buggy; it is known to miscompile kernels|PR58854' }
kind = "blacklist"
summary = "arm refuses GCC 4.8.0 to 4.8.2, which corrupt file systems (GCC PR 58854)"
fixed-by = [ { commit = "7fc150543c73", note = "the blacklist is the policy, removed in 5.8 with the 4.9 minimum" } ]
gcc = ">=4.8.0, <=4.8.2"
platform = ["arm"]
kernel = ">=3.18, <5.8"

[[signature]]
class = "gcc-min-46"
