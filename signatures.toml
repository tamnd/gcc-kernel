gcc = ">=10"

[[signature]]
class = "gnu11-extern-inline"
rung = "L3"
match = { first-error = 'multiple definition of `(?:intel_gmbus_is_(?:forced_bit|port_valid)|tty_(?:driver_)?kref_get|prefetchw?)' }
kind = "default-change"
summary = "GCC 5 defaults to -std=gnu11, where extern inline emits the function in every unit, and the extern inline helpers in i915_drv.h, in 2.6.28 the tty kref helpers in tty.h, and up to 2.6.13 prefetch in the i386 processor.h stop linking"
fixed-by = [
  { commit = "e2afe67453e5", first-tag = "v2.6.14-rc1", note = "makes the extern inline helpers of include/asm-i386 static inline" },
  { commit = "14bfc987e395", first-tag = "v2.6.29-rc1", note = "makes tty_kref_get static inline, for a warning and not for GCC 5" },
  { commit = "8f375e10ee47", first-tag = "v3.11-rc1", note = "makes the i915 helpers static inline, and 3.10.108 builds with GCC 5 too" },
  { commit = "51b97e354ba9", first-tag = "v3.18-rc5", note = "builds the kernel with -std=gnu89" },
]
