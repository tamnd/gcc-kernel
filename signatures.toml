# Miscompiles, found only by booting.

[[signature]]
class = "asm-goto-miscompile"
rung = "L5..L7"
match = { first-error = 'Kernel panic|BUG:|Oops|general protection fault|Unable to handle kernel' }
kind = "miscompile"
summary = "GCC up to 4.8.1 miscompiles asm goto (GCC PR 58670) and the kernel crashes where it uses jump labels"
fixed-by = [
  { commit = "3f0116c", first-tag = "v3.12-rc5" },
  { commit = "a9f180345f53", first-tag = "v3.14-rc3", note = "makes the workaround unconditional" },
]
gcc = ">=4.5, <=4.8.1"
kernel = "<3.12"

[[signature]]
class = "gcc49-load-balance"
rung = "L5..L7"
match = { first-error = 'Kernel panic|BUG:|Oops|general protection fault|Unable to handle kernel|detected stalls|soft lockup' }
kind = "miscompile"
summary = "GCC 4.9.0 and 4.9.1 spill a register wrong in the scheduler's load_balance() (GCC PR 61801)"
fixed-by = [ { commit = "2062afb4f804", first-tag = "v3.16-rc7", stable = ["3.13"] } ]
gcc = "4.9.0 | 4.9.1"
kernel = "<3.16"

[[signature]]
class = "gcc10-start-secondary"
rung = "L5"
