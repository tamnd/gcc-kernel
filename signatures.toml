class = "binutils-x86-64-macro-redefined"
rung = "L3"
match = { first-error = 'Macro with this name was already defined', unit = 'arch/x86_64/kernel/entry' }
kind = "binutils-assembler"
summary = "binutils 2.16 refuses the macro that x86_64 entry.S defines twice, up to 2.6.10"
binutils = ">=2.16"
kernel = "<2.6.11"
platform = ["x86_64"]

[[signature]]
class = "binutils-size-undefined"
rung = "L3"
match = { first-error = '\.size expression for copy_user_generic_c does not evaluate to a constant' }
kind = "binutils-assembler"
summary = "3022d734a54c in 2.6.19 renamed copy_user_generic_c in the x86_64 copy_user.S and left its END behind, and gas from binutils 2.21 refuses a .size for a symbol that is not defined, where 2.20 let it pass"
fixed-by = [ { commit = "ad2fc2cd9253", first-tag = "v2.6.27-rc1", note = "rewrites copy_user_64.S without the stale END" } ]
binutils = ">=2.21"
kernel = ">=2.6.19, <2.6.27"
platform = ["x86_64"]

[[signature]]
class = "binutils-segment-mov"
rung = "L3"
match = { first-error = " `mov'", unit = 'arch/(?:i386|x86_64)/kernel/process' }
kind = "binutils-assembler"
summary = "binutils 2.17 and later refuse a 32 bit mov between a segment register and memory or a 64 bit register, which process.c does up to 2.6.11"
fixed-by = [ { commit = "fd51f666fa59", first-tag = "v2.6.12-rc4" } ]
binutils = ">=2.17"
kernel = "<2.6.12"
platform = ["x86_64", "i386"]

[[signature]]
class = "binutils-range-ok-cmp"
rung = "L3"
match = { first-error = "for `cmp'", unit = 'fs/binfmt_aout' }
kind = "binutils-assembler"
summary = "__range_ok in the i386 uaccess.h lets GCC put an immediate as the destination of cmpl, which binutils 2.20 and later refuse"
fixed-by = [ { commit = "722f4f5b2600", first-tag = "v2.6.18-rc1", bisected = true } ]
binutils = ">=2.20"
kernel = "<2.6.18"
platform = ["i386"]

[[signature]]
class = "binutils-plt32"
rung = "L4..L5"
match = { first-error = 'R_X86_64_PLT32|[Uu]nknown rela relocation: 4|Unsupported relocation type' }
kind = "binutils-relocation"
summary = "binutils 2.31 emits R_X86_64_PLT32, which the relocs tool and the module loader reject"
fixed-by = [ { commit = "b21ebf2fb4cd", first-tag = "v4.16", stable = ["3.18", "4.4", "4.9", "4.14"] } ]
binutils = ">=2.31"
platform = ["x86_64"]

[[signature]]
class = "binutils-separate-code"
rung = "L5"
match = { console = '\A\s*\z' }
kind = "binutils-layout"
summary = "binutils 2.31's -z separate-code and 4 KB page size break the kernel's 2 MB alignment, and it boots silently into nothing"
fixed-by = [ { commit = "e3d03598e8ae", first-tag = "v4.16", stable = ["4.4", "4.9", "4.14"] } ]
binutils = ">=2.31"
platform = ["x86_64"]

[[signature]]
class = "binutils-got32x"
rung = "L5"
match = { first-error = 'R_386_GOT32X|Failed to allocate space for phdrs' }
kind = "binutils-relocation"
summary = "binutils 2.26 relaxes to R_386_GOT32X and the compressed kernel fails to boot"
fixed-by = [ { commit = "6d92bc9d483a", first-tag = "v4.6", stable = ["3.10", "3.12", "4.4"] } ]
binutils = ">=2.26"
platform = ["i386"]

[[signature]]
class = "binutils-objtool-symtab"
rung = "L3"
match = { first-error = 'objtool: missing symbol table' }
kind = "binutils-objtool"
summary = "binutils 2.36 writes no symbol table for an empty object, which thunk_64.o is without CONFIG_PREEMPTION, and objtool before 5.11 gives up on it"
fixed-by = [ { commit = "1d489151e9f9", first-tag = "v5.11-rc5" } ]
binutils = ">=2.36"
kernel = "<5.11"
platform = ["x86_64", "i386"]

[[signature]]
class = "binutils-objtool-align"
rung = "L3"
match = { first-error = 'objtool: elf_update: invalid section alignment' }
kind = "binutils-objtool"
summary = "objtool built against the libelf of Debian 10 and 11 cannot write back an object that binutils 2.45 or later assembled, so 5.10 and 5.15 stop on the first object objtool changes while binutils 2.43 builds them, and Chris Packham saw the same on 6.6 and 6.12 in a Debian 11 container"
binutils = ">=2.45"
kernel = ">=4.20, <6.0"
platform = ["x86_64"]

[[signature]]
class = "binutils-riscv-zicsr"
rung = "L3"
match = { first-error = 'unrecognized opcode `(?:csr|fence\.i)' }
kind = "binutils-isa"
summary = "binutils 2.38 splits Zicsr and Zifencei out of the base ISA"
fixed-by = [ { commit = "6df2a016c0c8", first-tag = "v5.17", stable = ["4.19", "5.4", "5.10", "5.15"] } ]
binutils = ">=2.38"
platform = ["riscv64"]

[[signature]]
class = "binutils-rwx-warning"
rung = "L4"
match = { first-error = 'LOAD segment with RWX permissions|missing \.note\.GNU-stack' }
kind = "binutils-warning"
summary = "binutils 2.39 warns about RWX segments and executable stacks, fatal with CONFIG_WERROR from 6.18"
fixed-by = [
  { commit = "0d362be5b142", first-tag = "v6.0", stable = ["4.14", "4.19", "5.4", "5.10", "5.15"] },
  { commit = "ffcf9c5700e4", first-tag = "v6.0", stable = ["4.14", "4.19", "5.4", "5.10", "5.15"] },
]
binutils = ">=2.39"

[[signature]]
class = "binutils-loongarch-relax"
rung = "L5..L7"
match = { first-error = '[Uu]nknown relocation type|[Uu]nsupported relocation type' }
kind = "binutils-relocation"
summary = "binutils 2.41 relaxes by default and loongarch modules fail to load"
fixed-by = [ { commit = "03c53eb90c0c", first-tag = "v6.5" } ]
binutils = ">=2.41"
platform = ["loongarch64"]

[[signature]]
class = "binutils-ppc-ztext"
rung = "L4"
match = { first-error = 'read-only segment has dynamic relocations' }
kind = "binutils-link"
summary = "binutils 2.46 links with -z text by default on powerpc"
fixed-by = [ { commit = "97f902dd4c99", first-tag = "v7.2" } ]
binutils = ">=2.46"
platform = ["ppc64le"]

# The rest of -Werror (open question 9): a warning that an architecture's or a directory's own -Werror makes fatal, which CONFIG_WERROR=n does not reach, and which no signature above names. It is last so that every named warning wins over it, and it has no ranges, so it never turns into a finding. Triage splits it into named classes as cells come in.

[[signature]]
class = "arch-werror"
rung = "L3"
match = { first-error = '\[-Werror(?:=[\w-]+(?:=\d+)?)?\]|all warnings being treated as errors' }
kind = "new-warning-werror"
summary = "A new warning that an architecture's or a directory's own -Werror makes fatal"
