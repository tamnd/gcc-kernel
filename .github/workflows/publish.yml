# Regenerate matrix/ and reports/ from the newest store mirror and commit them, then publish the static site to GitHub Pages (spec 10.7 and 10.9).
#
# The store mirror is the newest `sweep-<date>` release that sweep.yml attached a store pack to. The new GCC report is written for the upstream column released last, and for GCC 16.2, which rucc claims to match.

name: publish

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  publish:
    name: matrix, reports and site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build gk
        run: cargo build --release --locked -p gk
      - name: fetch the newest store mirror
        id: store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("sweep-"))] | sort_by(.tagName) | last | .tagName // ""')
          if [ -z "$tag" ]; then
            echo "no store mirror yet, so the matrix stays as it is"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$tag" --pattern "$tag.tar.zst"
          mkdir -p "$RUNNER_TEMP/store"
          tar -I zstd -xf "$tag.tar.zst" -C "$RUNNER_TEMP/store"
          rm "$tag.tar.zst"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: publish
        env:
          GK_STORE: ${{ runner.temp }}/store
          TAG: ${{ steps.store.outputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            ./target/release/gk publish
            ./target/release/gk report new-gcc latest
            ./target/release/gk report new-gcc gcc-16.2.0
          fi
          ./target/release/gk publish --html site --site-only
      - name: commit
        if: steps.store.outputs.tag != ''
        env:
          TAG: ${{ steps.store.outputs.tag }}
        run: |
          git add README.md matrix reports
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Publish the matrix from $TAG"
          git push -q origin HEAD:main
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    name: deploy the site
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
