# Builds the host, forge and boot containers under provision/ and pushes them to ghcr.io/tamnd/gcc-kernel, when their Dockerfiles change on main or when run by hand.
#
# Each image is pushed under its commit and gets a build provenance attestation. The digest is printed in the job summary, and hosts.toml pins it through a normal pull request, so an image only reaches a cell once someone has reviewed its digest. There is no build cache: a publishing workflow should not read a cache that pull requests can write.

name: images

on:
  push:
    branches: [main]
    paths:
      - "provision/hosts/**"
      - "provision/forge/**"
      - "provision/boot/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gk-host-sarge
            dir: provision/hosts/gk-host-sarge
          - name: gk-host-etch
            dir: provision/hosts/gk-host-etch
          - name: gk-host-lenny
            dir: provision/hosts/gk-host-lenny
          - name: gk-host-squeeze
            dir: provision/hosts/gk-host-squeeze
          - name: gk-host-wheezy
            dir: provision/hosts/gk-host-wheezy
          - name: gk-host-jessie
            dir: provision/hosts/gk-host-jessie
          - name: gk-host-stretch
            dir: provision/hosts/gk-host-stretch
          - name: gk-host-bookworm
            dir: provision/hosts/gk-host-bookworm
          - name: gk-host-trixie
            dir: provision/hosts/gk-host-trixie
          - name: gk-forge-modern
            dir: provision/forge/gk-forge-modern
          - name: gk-forge-bullseye
            dir: provision/forge/gk-forge-bullseye
          - name: gk-forge-stretch
            dir: provision/forge/gk-forge-stretch
          - name: gk-forge-jessie
            dir: provision/forge/gk-forge-jessie
          - name: gk-forge-squeeze
            dir: provision/forge/gk-forge-squeeze
          - name: gk-forge-etch
            dir: provision/forge/gk-forge-etch
          - name: gk-boot
            dir: provision/boot/gk-boot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.dir }}
          push: true
          provenance: mode=max
          tags: |
            ghcr.io/tamnd/gcc-kernel/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/tamnd/gcc-kernel/${{ matrix.name }}:latest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/tamnd/gcc-kernel/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: summary
        env:
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "\`$NAME\` is \`ghcr.io/tamnd/gcc-kernel/$NAME@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
