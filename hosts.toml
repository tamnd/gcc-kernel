# Host environments and forge containers (spec 05.2 and 04.4).
#
# A host is where a kernel is built: its GCC is HOSTCC and its make, perl, bison and flex run the build. The compiler under test never comes from the host. It comes in through CROSS_COMPILE as a static bundle built in a forge. `image` is the pushed image by digest and stays empty until the image has been built. The GCC, binutils and make versions are the ones the tools give for themselves in their `--version`, which `gk hosts check` compares with the images. For a snapshot or prerelease that is not the package version: etch's gcc 4.1.1 package calls itself 4.1.2, lenny's binutils 2.18.1 calls itself 2.18.0.20080103, slink's 2.9.1.0.19a says 2.9.1, and hamm's make 3.76 says 3.76.1. The one `boot` container holds the QEMU that boots every cell, and its digest is part of each booted cell's identity.

[[host]]
name = "gk-host-minix"
kind = "host"
base = "Minix-386 1.5.10 with Bruce Evans's 386 patches, in QEMU"
arches = ["emulated"]
gcc = "1.40"

[[host]]
name = "gk-host-linux012"
kind = "host"
base = "the oldlinux Linux 0.11 development disk with the gcc 1.40 binaries of 1991-09-22, in Bochs, since QEMU does not run these kernels (reports/museum-0x.md)"
arches = ["emulated"]
gcc = "1.40"

