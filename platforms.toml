# Tier 3 (spec 06.1): build only for now, on the Current set and the longterm stripe with GCC 16.2. None has an init pin, so no cell boots. The machines, CPUs and consoles are the ones Guenter Roeck's tests boot, written down so that booting needs only the pin. The steps start at the kernel where the named defconfig was checked, and older kernels get their own steps when a stripe reaches them.

