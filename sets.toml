# The rules that decide which kernel trees and binutils releases are pinned (spec 03.1).
#
# `gk pins` applies them to kernel.org's releases.json, the sha256sums.asc of each kernel directory and the GNU mirror, and `gk pins --write` writes kernels.toml and binutils.toml. G0 started the releases set at 5.0. G2 moves it back to 3.0 and adds the last points, and G3 takes both back to 2.6.

# Every line kernel.org still maintains, at its latest point release.
[[set]]
name = "current"
monikers = ["stable", "longterm"]

# Every mainline release, X.Y, from this one on.
[[set]]
name = "releases"
releases-from = "3.0"

# The newest point release of every X.Y line from this one on, which for a line that has ended is its last.
[[set]]
name = "last-points"
last-points-from = "3.0"

# The last point of every line that was ever longterm, which the search runs dense on tier 1 (spec 09.6).
[[set]]
name = "longterm-stripe"
last-points-of = ["3.0", "3.2", "3.4", "3.10", "3.12", "3.14", "3.16", "3.18", "4.1", "4.4", "4.9", "4.14", "4.19", "5.4", "5.10", "5.15", "6.1", "6.6", "6.12"]

[gnu]
# Every binutils release from this one on. GCC 4.6.4, the oldest G2 column, pairs with 2.23.2. Releases before 2.28.1 are on the mirror as .tar.bz2, and those are pinned instead. G3 moves this back for the museum columns.
binutils-from = "2.23"
