# The GCC columns of the matrix (spec 04).
#
# Written by hand. `gk pins --write` fills in the url, the release date and the SHA-256 of upstream columns where they are left empty. G0 built x86_64 and aarch64 bundles, G1 adds i686 for the i386 platform, G2 adds the last points from 4.6 to 7.5 and the era GCCs of M7 to M10, and the other targets join with their platforms.

[[gcc]]
id = "gcc-4.6.4"
version = "4.6.4"
flavor = "upstream"
released = "2013-04-12"
url = "https://ftp.gnu.org/gnu/gcc/gcc-4.6.4/gcc-4.6.4.tar.bz2"
sha256 = "35af16afa0b67af9b8eb15cafb76d2bc5f568540552522f5dc2c88dd45d977e8"
forge = "gk-forge-jessie"
targets = ["x86_64-linux-gnu", "i686-linux-gnu"]
binutils = "auto"
columns = ["last-point"]
why = "The last 4.6. GCC 4.6 has no aarch64 back end."

