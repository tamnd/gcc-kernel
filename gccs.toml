# The GCC columns of the matrix (spec 04).
#
# Written by hand. `gk pins --write` fills in the url, the release date and the SHA-256 of upstream columns where they are left empty. G0 builds x86_64 and aarch64 bundles, and the other targets join with their platforms.

[[gcc]]
id = "gcc-8.5.0"
version = "8.5.0"
flavor = "upstream"
released = "2021-05-14"
url = "https://ftp.gnu.org/gnu/gcc/gcc-8.5.0/gcc-8.5.0.tar.xz"
sha256 = "d308841a511bb830a6100397b0042db24ce11f642dab6ea6ee44842e5325ed50"
forge = "gk-forge-bullseye"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu"]
binutils = "auto"
columns = ["last-point"]

